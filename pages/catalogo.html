<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Catálogo de productos agrícolas locales de AgriMarket Soacha–Sibaté.">
  <title>Productos | AgriMarket Soacha–Sibaté</title>
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
  <header class="site-header catalog-header">
    <a class="brand" href="../index.html" aria-label="AgriMarket - Inicio">
      <span class="brand-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24"><path d="M19.7 4.3C14.7 4 9.9 5.2 7 8.1c-2.6 2.6-2.7 6.1-2.5 8.1 2.2-4.2 5.8-6.7 10.9-8.4-4.3 2.2-7.5 5.3-9.2 9.6-.6 1.5-.9 2.8-1 3.8h2.1c.2-1.2.5-2.4 1-3.6 5.7.2 9.8-2.5 11.2-7.7.6-2.2.4-4.3.2-5.6Z"/></svg>
      </span>
      <span class="brand-name"><span class="brand-dark">Agri</span><span class="brand-green">Market</span></span>
    </a>

    <nav class="main-nav catalog-nav" aria-label="Navegación principal">
      <a href="../index.html">Inicio</a>
      <a class="active" href="catalogo.html">Productos</a>
      <a href="catalogo.html#categorias">Categorías</a>
      <a href="solicitudes.html">Mis solicitudes</a>
    </nav>

    <a class="profile-link" href="login.html" aria-label="Perfil de usuario">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M12 12a4.5 4.5 0 1 0 0-9 4.5 4.5 0 0 0 0 9Zm0-7a2.5 2.5 0 1 1 0 5 2.5 2.5 0 0 1 0-5Zm0 9c-4.4 0-8 2.5-8 5.5V22h2v-2.5c0-2.1 2.7-3.5 6-3.5s6 1.4 6 3.5V22h2v-2.5c0-3-3.6-5.5-8-5.5Z"/>
      </svg>
    </a>
  </header>

  <main class="catalog-shell">
    <section class="catalog-intro" aria-labelledby="catalog-title">
      <h1 id="catalog-title">Catálogo de productos</h1>
      <p>Explora productos agrícolas locales de Soacha y Sibaté.</p>
    </section>

    <div class="catalog-layout">
      <aside class="filters-panel" aria-label="Filtros del catálogo">
        <h2>Filtros</h2>

        <div class="filter-group">
          <label for="sidebar-search">Buscar</label>
          <div class="search-control search-control-small">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m21 20-5.2-5.2a7.5 7.5 0 1 0-1 1L20 21l1-1Zm-11.5-5A5.5 5.5 0 1 1 9.5 4a5.5 5.5 0 0 1 0 11Z"/></svg>
            <input id="sidebar-search" type="search" placeholder="Buscar productos agrícolas">
          </div>
        </div>

        <div class="filter-group" id="categorias">
          <h3>Categorías</h3>
          <label class="check-row"><input type="checkbox" name="categoria" value="frutas"> <span>Frutas</span></label>
          <label class="check-row"><input type="checkbox" name="categoria" value="verduras" checked> <span>Verduras y hortalizas</span></label>
          <label class="check-row"><input type="checkbox" name="categoria" value="tuberculos"> <span>Tubérculos</span></label>
          <label class="check-row"><input type="checkbox" name="categoria" value="granos"> <span>Granos</span></label>
          <label class="check-row"><input type="checkbox" name="categoria" value="otros"> <span>Otros productos</span></label>
        </div>

        <div class="filter-group">
          <h3>Rango de precio</h3>
          <div class="price-row">
            <input id="precio-min" type="number" min="0" step="100" placeholder="Mínimo">
            <input id="precio-max" type="number" min="0" step="100" placeholder="Máximo">
          </div>
        </div>

        <div class="filter-group">
          <h3>Disponibilidad</h3>
          <label class="check-row"><input id="disponibles" type="checkbox" checked> <span>Disponibles</span></label>
          <label class="check-row"><input id="agotados" type="checkbox"> <span>Agotados</span></label>
        </div>

        <button id="aplicar-filtros" class="btn btn-primary apply-filters" type="button">Aplicar filtros</button>
      </aside>

      <section class="catalog-content" aria-label="Listado de productos">
        <div class="catalog-toolbar">
          <div class="search-control catalog-search">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m21 20-5.2-5.2a7.5 7.5 0 1 0-1 1L20 21l1-1Zm-11.5-5A5.5 5.5 0 1 1 9.5 4a5.5 5.5 0 0 1 0 11Z"/></svg>
            <input id="catalog-search" type="search" placeholder="Buscar productos agrícolas">
          </div>

          <select id="ordenar-productos" class="sort-select" aria-label="Ordenar productos">
            <option value="recientes">Ordenar: Más recientes</option>
            <option value="precio-asc">Precio: menor a mayor</option>
            <option value="precio-desc">Precio: mayor a menor</option>
            <option value="nombre">Nombre A–Z</option>
          </select>
        </div>

        <div class="catalog-results-heading">
          <h2>Productos (<span id="product-count">24</span>)</h2>
        </div>

        <div id="catalog-product-grid" class="catalog-product-grid" aria-live="polite"></div>

        <div id="empty-state" class="catalog-empty" hidden>
          No encontramos productos con esos filtros.
        </div>

        <nav id="catalog-pagination" class="catalog-pagination" aria-label="Paginación del catálogo"></nav>
      </section>
    </div>
  </main>

  <script src="../js/storage.js"></script>
  <script src="../js/productos.js"></script>
</body>
</html>
